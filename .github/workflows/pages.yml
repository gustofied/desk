name: Deploy Desk to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap_preview_archive:
        description: Create the published-preview archive branch if it is absent (first deployment only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build Desk
        run: npm run build

      - name: Check share preview images and links
        run: npm run check:previews

      # Validate the generated runtimes after building from bundled source data.
      - name: Validate market snapshots
        run: npm run check:data

      - name: Run unit tests
        run: npm test

      - name: Assemble deployment
        run: npm run build:site

      # Archive updates must succeed before publishing URLs that depend on them.
      - name: Retain published previews across deployments
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_PREVIEW_ARCHIVE_BOOTSTRAP: ${{ inputs.bootstrap_preview_archive && 'true' || 'false' }}
        run: node scripts/published-preview-archive.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
