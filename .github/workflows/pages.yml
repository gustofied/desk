name: Deploy Desk to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Off the busy top of the hour; GitHub schedules use UTC.
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name != 'schedule' || vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS == 'confirmed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Set equity cache date
        id: equity-date
        if: vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS == 'confirmed'
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Cache only licensed observations, never a token or the whole .cache tree.
      # GitHub caches are immutable and are not a confidentiality boundary.
      - name: Restore equity observations
        id: equity-cache
        if: vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS == 'confirmed'
        uses: actions/cache/restore@v6
        with:
          path: .cache/equities-source.json
          key: desk-equities-source-v1-${{ steps.equity-date.outputs.day }}
          restore-keys: desk-equities-source-v1-

      - name: Plan equity refresh without provider access
        id: equity-plan
        env:
          EQUITIES_PUBLIC_DISPLAY_RIGHTS: ${{ vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS }}
        run: node scripts/plan-equities-refresh.mjs

      - name: Fetch daily equity observations
        if: vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS == 'confirmed' && steps.equity-plan.outputs.refresh == 'true'
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: node scripts/refresh-equities.mjs

      # Save immediately after a successful refresh, so a later build failure can
      # be rerun using these observations without another nine provider calls.
      - name: Validate refreshed equity cache identity
        if: vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS == 'confirmed' && steps.equity-plan.outputs.refresh == 'true'
        env:
          EQUITY_CACHE_DAY: ${{ steps.equity-date.outputs.day }}
        run: node scripts/plan-equities-refresh.mjs --verify-cache-day "$EQUITY_CACHE_DAY"

      - name: Cache refreshed equity observations
        if: vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS == 'confirmed' && steps.equity-plan.outputs.refresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/equities-source.json
          key: desk-equities-source-v1-${{ steps.equity-date.outputs.day }}

      - name: Build Desk
        env:
          EQUITIES_PUBLIC_DISPLAY_RIGHTS: ${{ vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS }}
        run: npm run build

      # Generated runtime/manifest assertions must follow the cache-backed build.
      - name: Validate market snapshots
        env:
          EQUITIES_PUBLIC_DISPLAY_RIGHTS: ${{ vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS }}
        run: npm run check:data

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Assemble deployment
        env:
          EQUITIES_PUBLIC_DISPLAY_RIGHTS: ${{ vars.EQUITIES_PUBLIC_DISPLAY_RIGHTS }}
        run: npm run build:site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
